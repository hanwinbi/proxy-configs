;static = Disney+, Global Media, Singapore, Hong Kong, Taiwan, United States, img-url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Disney.png
;static = Max, Global Media, Singapore, Taiwan, Hong Kong, img-url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/HBO_Max.png
static = Netflix, Global Media, Hong Kong, Taiwan, Singapore, Japan, United States, img-url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Netflix.png
static = Spotify, direct, Global Media, Hong Kong, Taiwan, Singapore, Japan, United States, img-url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Spotify.png
static = YouTube, Global Media, Hong Kong, Taiwan, Singapore, Japan, United States, img-url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/YouTube.png
static = Google, Global Media, Hong Kong, Taiwan, Singapore, Japan, United States, img-url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Google_Search.png
