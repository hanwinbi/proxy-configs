[policy]
# 其中 CMedia 策略组为中国媒体，GMedia 为国际媒体，Outside 为境外链接，Fallback 为最终规则（下方节点分组里的 Regions 是韩国等不常用地区及 MITM 专用节点的统一分组，两者含义不同，别混淆）
