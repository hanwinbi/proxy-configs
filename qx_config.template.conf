;static = PayPal, Outside, direct, img-url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/PayPal.png
;static = TikTok, Outside, Japan, Regions, Taiwan, United States, direct, img-url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/TikTok.png
static = AppleUpdate, reject, direct, img-url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Apple_Update.png
# 必须策略
static = Speedtest, direct, Hong Kong, Taiwan, Singapore, Japan, United States, img-url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Speedtest.png
static = Fallback, Outside, direct, img-url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Final.png
# 节点策略。若机场不包含下方所有国家/地区节点，请删除不包含的部分，并删除上方对应国家/地区策略名
url-latency-benchmark = Auto, server-tag-regex=^(?!.*(1\.[1-9]x|[2-9]x|到期|重置)).*$, check-interval=600, tolerance=0, alive-checking=false, img-url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Auto.png
